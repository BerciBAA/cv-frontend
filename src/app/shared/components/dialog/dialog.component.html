<section class="backdrop-blur rounded-2xl bg-gray-200 sm:p-6 h-full flex flex-col">
  <header
    class="sticky top-0 z-10 -mx-1 sm:-mx-2 px-3 sm:px-4 py-2 flex items-center justify-between">
    <h5 class="text-xl sm:text-2xl font-semibold">
      {{ title() || (titleKey() ? (titleKey() | translate) : '') }}
    </h5>

    <div class="flex items-center gap-2">
      <ng-content select="[dialog-header-actions]"></ng-content>

      <button
        type="button"
        (click)="close.emit()"
        class="inline-flex items-center justify-center w-10 h-10 sm:w-12 sm:h-12 rounded-full outline-none
                 bg-white border border-slate-200 shadow hover:bg-slate-50
                 focus-visible:ring-2 focus-visible:ring-indigo-500 focus-visible:ring-offset-2"
        aria-label="Close">
        <svg aria-hidden="true" viewBox="0 0 24 24" class="w-7 h-7 sm:w-8 sm:h-8 text-slate-700">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </header>
      <ng-content></ng-content>
</section>
