<div class="w-full flex">

  <label class="inline-flex items-center gap-3 mr-2 mb-3">
    <input
      id="custom-checkbox"
      type="checkbox"
      [checked]="checked"
      [disabled]="disabled"
      (input)="onChange($any($event.target).checked)"
      (blur)="onBlur()"
      class="h-5 w-5 rounded border border-slate-300 focus:outline-none focus:ring-1 focus:ring-black transition"
      [class]="checkboxClasses()"
    />
    <span *ngIf="inlineText">{{ inlineText }}</span>
  </label>

  <label class="block mb-1 text-base pointer-events-none" [class]="labelClasses()">
    {{ label }}
  </label>


</div>
