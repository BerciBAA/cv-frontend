<div class="w-full">
  <label class="pointer-events-none" [class]="labelClasses()">{{ label }}</label>
  <div class="relative">

    <input
      matInput
      [matDatepicker]="picker"
      [placeholder]="placeholder"
      [min]="minDate"
      [max]="maxDate"
      [required]="required"
      [disabled]="disabled"
      (dateInput)="onDateInput($event.value)"
      (dateChange)="onDateInput($event.value)"
      readonly
      class="w-full px-4 py-2 border border-slate-300 rounded-xl shadow-sm focus:outline-none focus:ring-1 focus:ring-black transition"
      [class]="inputClasses()"
      (click)="picker.open()" />

    <button type="button"
            (click)="picker.open()"
            class="absolute inset-y-0 right-2 my-auto h-9 px-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition"
            aria-label="Naptár megnyitása">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="1.5"
           class="w-5 h-5 text-slate-600 dark:text-slate-300">
        <path d="M8 2v3M16 2v3M3 10h18M4 7h16a1 1 0 0 1 1 1v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a1 1 0 0 1 1-1z"/>
      </svg>
    </button>
  </div>

  <mat-datepicker #picker [panelClass]="panelClass()"></mat-datepicker>
</div>
