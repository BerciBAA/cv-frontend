<section
  [ngClass]="baseClasses()"
  class="group w-full h-full p-6 rounded-2xl shadow ring-1 ring-transparent
         hover:shadow-xl transition duration-300
         overflow-hidden flex flex-col cursor-pointer">

  <h3 class="text-xl font-semibold transition-colors leading-tight break-words clamp-2"
      [attr.title]="title">
    {{ title }}
  </h3>

  <p class="mt-2 break-words clamp-5 flex-1 opacity-80"
     [attr.title]="description">
    {{ description }}
  </p>
</section>
