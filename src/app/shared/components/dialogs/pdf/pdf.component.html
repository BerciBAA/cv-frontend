<section
         class="backdrop-blur rounded-2xl pb-3 sm:px-5 space-y-5 h-full flex flex-col justify-between">

  <form [formGroup]="form"
        (ngSubmit)="onSave()"
        class="space-y-6 flex flex-col justify-between h-full flex-1 min-h-0">

    <section class="flex-1 min-h-0 flex flex-col space-y-6">
      <app-input
        label="Cím:"
        placeholder="Pl. Tanulmányi anyag"
      >
      </app-input>


      <div class="flex-1 min-h-0">
        <app-textarea
          label="Leírás"
          placeholder="Itt meg tudod nézni a letölthető PDF-et…"

          class="h-full min-h-0">
        </app-textarea>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="space-y-2">
          <label class="block text-base text-lg">PDF fájl</label>
          <input type="file"
                 accept="application/pdf"
                 (change)="onFileSelected($event)"
                 class="block w-full text-sm cursor-pointer text-gray-700 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer" />
        </div>
      </div>
    </section>

    <!-- Gombok -->
    <div class="pt-4 flex items-center justify-end gap-3">
      <app-button type="button" (click)="onCancel()">Mégse</app-button>
      <app-button type="submit">Mentés</app-button>
    </div>
  </form>
</section>
