  <form [formGroup]="form"
        (ngSubmit)="onSave()"
        class="space-y-6 flex flex-col justify-between h-full flex-1 min-h-0  mx-3">

    <section class="flex-1 min-h-0 flex flex-col space-y-6">
      <app-input
        [label]="'pdf.label.title' | translate"
        [placeholder]="'pdf.placeholder.exampleTitle' | translate"
        formControlName="title">
      </app-input>


      <div class="flex-1 min-h-0">
        <app-textarea
          [label]="'pdf.label.description' | translate"
          [placeholder]="'pdf.placeholder.exampleDescription' | translate"
          formControlName="description"
          class="h-full min-h-0">
        </app-textarea>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="space-y-2">
          <label class="block text-base text-lg">
            {{ 'pdf.label.file' | translate }}
          </label>
          <input
            type="file"
            accept="application/pdf"
            (change)="onFileSelected($event)"
            [attr.aria-label]="'pdf.placeholder.chooseFile' | translate"
            class="block w-full text-sm cursor-pointer text-gray-700 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:bg-indigo-600 file:text-white hover:file:bg-indigo-500"/>
        </div>
      </div>
    </section>

    <div class="mb-3 flex items-center justify-end gap-3">
      <app-button (click)="onCancel()">{{ 'global.button.cancel' | translate }}</app-button>
      <app-button type="submit">{{ 'global.button.save' | translate }}</app-button>
    </div>
  </form>
