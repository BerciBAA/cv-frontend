<app-dialog
  [titleKey]="'addSectionCard.title.selectComponent'"
  (close)="close()">

@if (!isSelected()){
  <main
    class="content grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 auto-rows-[14rem] sm:auto-rows-[15rem] gap-4 sm:gap-5 lg:gap-6 p-3 sm:p-4 min-h-0 overflow-auto overscroll-y-contain"
    [class]="baseClasses().join(' ')"
  >
    <app-add-section-card
      title="{{ 'addSectionCard.title.uniqueText' | translate }}"
      (click)="select(State.EDITOR)"
      description="{{ 'addSectionCard.description.uniqueText' | translate }}"
    />
    <app-add-section-card
      title="{{ 'addSectionCard.title.pdfDocument' | translate }}"
      (click)="select(State.PDF)"
      description="{{ 'addSectionCard.description.pdfDocument' | translate }}"
    />
    <app-add-section-card
      title="{{ 'addSectionCard.title.Skills' | translate }}"
      (click)="select(State.SKILLS)"
      description="{{ 'addSectionCard.description.Skills' | translate }}"
    />
    <app-add-section-card
      class="h-full"
      title="{{ 'addSectionCard.title.career' | translate }}"
      (click)="select(State.CAREER)"
      description="{{ 'addSectionCard.description.career' | translate }}"
    />
    <app-add-section-card
      title="{{ 'addSectionCard.title.projects' | translate }}"
      (click)="select(State.PROJECTS)"
      description="{{ 'addSectionCard.description.projects' | translate }}"
    />
    <app-add-section-card
      title="{{ 'addSectionCard.title.codeSnippet' | translate }}"
      (click)="select(State.CODE)"
      description="{{ 'addSectionCard.description.codeSnippet' | translate }}"
    />
  </main>
} @else {
  <main class="flex-1 min-h-0" [class]="baseClasses().join(' ')">
    @if (activeKind() === State.EDITOR){
      <app-html-editor class="h-full" (cancel)="cancelEditor()" />
    } @else if (activeKind() === State.SKILLS){
      <app-skills class="h-full" (cancel)="cancelEditor()" />
    } @else if (activeKind() === State.CAREER){
      <app-career-highlight class="h-full" (cancel)="cancelEditor()" />
    } @else if (activeKind() === State.PDF){
      <app-pdf class="h-full" (cancel)="cancelEditor()" />
    } @else if (activeKind() === State.CODE){
      <app-code
        class="h-full"
        (cancel)="cancelEditor()"
        [languages]="['Typescript','Java','Html']"
      />    } @else if (activeKind() === State.PROJECTS){
      <app-projects class="h-full" (cancel)="cancelEditor()" />
    }
  </main>
}
</app-dialog>
